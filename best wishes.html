<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Shubhang - Drag & Cut Cake Experience 🎂🔪</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #030712;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
            user-select: none;
        }

        body.disco-active {
            animation: partyPulse 0.4s infinite alternate;
        }
        @keyframes partyPulse {
            0% { background: #0f051d; }
            50% { background: #1d002c; }
            100% { background: #001f3f; }
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .ui-card {
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(25px);
            border: 2px solid #00f2fe;
            border-radius: 24px;
            padding: 25px;
            max-width: 500px;
            width: 92%;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 242, 254, 0.3);
        }

        .cyber-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            letter-spacing: 3px;
            color: #00f2fe;
            border: 1px solid #00f2fe;
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 12px;
            background: rgba(0, 242, 254, 0.1);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(135deg, #00f2fe, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Interactive Cutting Zone */
        .cutting-zone {
            height: 150px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            border: 2px dashed #00f2fe;
            margin: 15px 0;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .cake-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 65px;
            transition: all 0.5s ease;
        }

        .cake-container.sliced {
            gap: 40px;
        }

        .knife-draggable {
            position: absolute;
            font-size: 45px;
            cursor: grab;
            z-index: 20;
            top: 10px;
            right: 20px;
            transition: transform 0.1s ease;
            touch-action: none;
        }
        .knife-draggable:active {
            cursor: grabbing;
        }

        .synth-keyboard {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 15px 0;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 14px;
        }
        .key {
            width: 38px;
            height: 50px;
            background: #1e293b;
            border: 1px solid #00f2fe;
            border-radius: 6px;
            color: #00f2fe;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 6px;
            cursor: pointer;
        }
        .key:active {
            background: #00f2fe;
            color: #000;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .cyber-btn {
            flex: 1;
            padding: 12px;
            background: linear-gradient(90deg, #ff007f, #7928ca);
            border: none;
            border-radius: 20px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }
        .cyber-btn.secondary {
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            color: #000;
        }

        .prescription-modal {
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            border-radius: 16px;
            padding: 15px;
            margin-top: 15px;
            text-align: left;
            display: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-card">
        <div class="cyber-header">⚡ MANUAL CAKE CUTTING LAB v6.0 ⚡</div>
        <h1>Dr. Shubhang</h1>
        <p style="color: #94a3b8; font-size: 13px;">NEET Top Ranker • AIIMS Surgeon 🩺</p>

        <!-- Interactive Drag & Slice Cutting Area -->
        <div class="cutting-zone" id="cutZone">
            <p id="instructionText" style="position: absolute; top: 10px; font-size: 11px; color: #00f2fe; font-family: 'Orbitron';">
                1. Tap to Spawn Cake 🎂
            </p>
            
            <div class="cake-container" id="cakeContainer" onclick="spawnCake()" style="cursor: pointer;">
                <span id="leftCake">🧬</span>
                <span id="rightCake"></span>
            </div>

            <!-- Draggable Knife Emoji -->
            <div class="knife-draggable" id="knife" style="display: none;">🔪</div>
        </div>

        <!-- Synthesizer Piano -->
        <p style="font-size: 10px; color: #ff007f; font-family: 'Orbitron';">🎹 Interactive Cyber Piano</p>
        <div class="synth-keyboard">
            <div class="key" onclick="playSynth(261.63)">Sa</div>
            <div class="key" onclick="playSynth(293.66)">Re</div>
            <div class="key" onclick="playSynth(329.63)">Ga</div>
            <div class="key" onclick="playSynth(349.23)">Ma</div>
            <div class="key" onclick="playSynth(392.00)">Pa</div>
            <div class="key" onclick="playSynth(440.00)">Dha</div>
            <div class="key" onclick="playSynth(493.88)">Ni</div>
        </div>

        <div class="btn-group">
            <button class="cyber-btn" onclick="revealReport()">💊 Rx Report</button>
            <button class="cyber-btn secondary" onclick="toggleLaserDisco()">🪩 Laser Disco</button>
        </div>

        <div class="prescription-modal" id="modal">
            <b style="font-size: 18px; color: #7928ca;">Rx Report</b>
            <p style="font-size: 13px; margin-top: 5px;"><b>Name:</b> Dr. Shubhang</p>
            <p style="font-size: 13px;"><b>Diagnosis:</b> High Birthday Energy 🥳</p>
            <p style="font-size: 13px; color: #2563eb; margin-top: 5px;"><b>Doctor Order:</b> "Full Masti! AIIMS selection pakka hai!" 🔥</p>
        </div>
    </div>

    <script>
        let isCakeSpawned = false;
        let isCakeCut = false;

        // --- Spawn Cake Logic ---
        function spawnCake() {
            if (isCakeSpawned || isCakeCut) return;
            document.getElementById('leftCake').innerText = "🎂";
            document.getElementById('instructionText').innerText = "2. Drag Knife (🔪) across Cake to CUT!";
            document.getElementById('knife').style.display = "block";
            isCakeSpawned = true;
            playSynth(523.25);
        }

        // --- Drag & Drop Knife Mechanics ---
        const knife = document.getElementById('knife');
        const cutZone = document.getElementById('cutZone');
        let isDragging = false;

        knife.addEventListener('mousedown', startDrag);
        knife.addEventListener('touchstart', startDrag);

        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag);

        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchend', stopDrag);

        function startDrag(e) {
            if (!isCakeSpawned || isCakeCut) return;
            isDragging = true;
        }

        function drag(e) {
            if (!isDragging) return;
            
            const rect = cutZone.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);

            if (clientX && clientY) {
                let x = clientX - rect.left - 20;
                let y = clientY - rect.top - 20;
                knife.style.left = `${x}px`;
                knife.style.top = `${y}px`;

                // Check collision with Cake Center
                const cakeRect = document.getElementById('cakeContainer').getBoundingClientRect();
                if (
                    clientX > cakeRect.left &&
                    clientX < cakeRect.right &&
                    clientY > cakeRect.top &&
                    clientY < cakeRect.bottom
                ) {
                    triggerCakeSlice();
                }
            }
        }

        function stopDrag() {
            isDragging = false;
        }

        // --- Cake Cut Event Trigger ---
        function triggerCakeSlice() {
            if (isCakeCut) return;
            isCakeCut = true;

            // Cut Visuals
            document.getElementById('leftCake').innerText = "🍰";
            document.getElementById('rightCake').innerText = "🍰";
            document.getElementById('cakeContainer').classList.add('sliced');
            document.getElementById('instructionText').innerText = "🎉 HAPPY BIRTHDAY DR. SHUBHANG! 🎉";
            document.getElementById('instructionText').style.color = "#ff007f";
            knife.style.display = "none";

            // Audio & Voice FX
            playClappingSound();
            playBirthdayTune();
            
            if ('speechSynthesis' in window) {
                let msg = new SpeechSynthesisUtterance("Happy Birthday Doctor Shubhang! AIIMS is waiting for you!");
                msg.rate = 0.9;
                window.speechSynthesis.speak(msg);
            }

            // Celebration Confetti
            confetti({ particleCount: 200, spread: 140, origin: { y: 0.6 } });
            setTimeout(() => confetti({ particleCount: 150, spread: 100, origin: { y: 0.4 } }), 600);
        }

        // --- Audio Synthesizers ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSynth(freq, duration = 0.5) {
            let ctx = getAudioContext();
            let osc = ctx.createOscillator();
            let gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
        }

        function playClappingSound() {
            let ctx = getAudioContext();
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    let bufferSize = ctx.sampleRate * 0.05;
                    let buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    let data = buffer.getChannelData(0);
                    for (let j = 0; j < bufferSize; j++) data[j] = Math.random() * 2 - 1;
                    let noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    let gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    noise.connect(gain);
                    gain.connect(ctx.destination);
                    noise.start();
                }, i * 80 + Math.random() * 40);
            }
        }

        function playBirthdayTune() {
            const notes = [
                { f: 261.63, d: 0.3 }, { f: 261.63, d: 0.3 }, { f: 293.66, d: 0.6 },
                { f: 261.63, d: 0.6 }, { f: 349.23, d: 0.6 }, { f: 329.63, d: 1.0 },
                { f: 261.63, d: 0.3 }, { f: 261.63, d: 0.3 }, { f: 293.66, d: 0.6 },
                { f: 261.63, d: 0.6 }, { f: 392.00, d: 0.6 }, { f: 349.23, d: 1.0 }
            ];
            let delay = 0;
            notes.forEach(note => {
                setTimeout(() => { playSynth(note.f, note.d); }, delay * 1000);
                delay += note.d + 0.1;
            });
        }

        function revealReport() {
            document.getElementById('modal').style.display = 'block';
            confetti({ particleCount: 200, spread: 160, origin: { y: 0.7 } });
        }

        function toggleLaserDisco() {
            document.body.classList.toggle('disco-active');
            playSynth(440);
        }

        // --- 3D Background Particles ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const geometry = new THREE.BufferGeometry();
        const count = 700;
        const positions = new Float32Array(count * 3);
        for (let i = 0; i < count * 3; i++) positions[i] = (Math.random() - 0.5) * 16;
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ size: 0.04, color: 0x00f2fe, transparent: true, opacity: 0.8 });
        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        camera.position.z = 5;
        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.x += 0.001;
            particles.rotation.y += 0.0015;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
